<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<script defer src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
:root{--ivory:#fcfaf6;--bronze:#a48762;--espresso:#514239;--sage:#8f988c}
*{box-sizing:border-box}body{margin:0;background:#ebe9e5;color:#3b403c;font-family:system-ui,Arial,sans-serif}
.toolbar{position:sticky;top:0;z-index:20;padding:15px 22px;background:#fff;border-bottom:1px solid #ddd8d0;box-shadow:0 3px 18px #0001}
.bar{max-width:1380px;margin:auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.brand{margin-right:auto;color:#856b4c}.brand strong{font:600 24px Georgia}.brand small{display:block;color:#777;font-size:11px}
button,.filebtn{font:600 13px system-ui;cursor:pointer;padding:11px 14px;border:1px solid #cfc6ba;background:white;color:#5c5043;border-radius:8px}
button.primary{background:#796349;color:white}.filebtn input{display:none}
input[type=url]{flex:1;min-width:230px;padding:11px;border:1px solid #d4cec5;border-radius:8px}
.status{max-width:1380px;margin:10px auto;color:#6d6258;padding:0 12px;font-size:13px}
#stage{max-width:1450px;padding:12px;margin:auto}#viewport{position:relative;width:100%;overflow:hidden;border-radius:9px}
#poster{position:absolute;top:0;left:50%;width:2304px;height:3456px;transform-origin:top center;overflow:hidden;background:var(--ivory);color:var(--espresso);font-family:'Cormorant Garamond',Georgia,serif;box-shadow:0 15px 45px #0002}
.paper{position:absolute;inset:0;background:radial-gradient(ellipse at center,#fffefa 0%,#fcfaf6 70%,#f7f3ec 100%)}
.frame{position:absolute;inset:70px;border:3px solid var(--bronze);border-radius:40% 40% 3% 3% / 6% 6% 2% 2%;opacity:.8}
.frame.inner{inset:81px;border-width:1.5px;opacity:.6}
.dec{position:absolute;color:#a18a6f;opacity:.9;pointer-events:none;z-index:2}
.dec.top{top:55px;left:47%;font-size:120px}.dec.right{right:45px;top:250px;font-size:110px}.dec.left{left:36px;top:1350px;font-size:90px}.dec.bottom{bottom:64px;left:47%;font-size:95px}
.botanical{position:absolute;width:600px;height:800px;z-index:2;pointer-events:none;opacity:.86}
.botanical.tl{top:-60px;left:-65px}.botanical.br{bottom:-60px;right:-65px;transform:rotate(180deg)}
.botanical.sideL{left:-100px;top:1480px;transform:scale(.64) rotate(-15deg);opacity:.55}
.botanical.sideR{right:-110px;top:1430px;transform:scale(.64) rotate(155deg);opacity:.55}
.head{position:absolute;top:152px;left:330px;right:330px;text-align:center;z-index:3}
.kicker{font-size:60px;letter-spacing:.3em}.script{font-family:'Great Vibes',cursive;font-size:220px;color:#947453;line-height:1.05}
h1{font-weight:500;font-size:92px;letter-spacing:.055em;margin:-6px 0 0}
.rule{width:450px;max-width:65%;height:2px;background:#baa287;margin:17px auto}.date{font-size:43px;font-style:italic}
.serp{position:absolute;top:755px;left:805px;width:690px;text-align:center;z-index:4}.serp label{font-size:43px;letter-spacing:.13em}.serp svg{width:100%;height:135px}.serp small{font-style:italic;font-size:30px}
.aisle{position:absolute;left:1015px;top:1150px;width:275px;height:1670px;border:2px solid #dbccbb;border-radius:15px;color:#b6a48c;display:flex;align-items:center;justify-content:center;writing-mode:vertical-rl;letter-spacing:.24em;font-size:38px}
.table{position:absolute;width:418px;height:455px;padding:24px 18px 10px;border:2px solid #ccb698;border-radius:49% 49% 43% 43%/19% 19% 10% 10%;background:rgba(255,254,250,.92);text-align:center;z-index:4;overflow:hidden}
.table:before{content:'';position:absolute;inset:10px;border:1px solid #decbb1;border-radius:inherit;pointer-events:none}
.table h2{font:400 63px/1.1 'Great Vibes',cursive;color:#8f704d;margin:1px 0 5px}
.table ol{list-style:none;font-size:32px;line-height:1.09;margin:0;padding:0}
.table li{white-space:nowrap;text-overflow:ellipsis;overflow:hidden}.table li small{display:inline-block;width:38px;color:#9f8665;font-size:28px;margin-right:7px;text-align:right}
.table.over{outline:5px solid #b86b58}
.foot{position:absolute;bottom:115px;left:0;width:100%;text-align:center}.foot .sig{font:110px 'Great Vibes',cursive;color:#997751}.foot .txt{font-size:35px;letter-spacing:.06em}
@page{size:24in 36in;margin:0}
@media print{html,body{margin:0;width:24in;height:36in;background:white;overflow:hidden}.toolbar,.status{display:none!important}#stage,#viewport{width:24in!important;height:36in!important;max-width:none!important;margin:0!important;padding:0!important;overflow:visible!important}#poster{left:0!important;top:0!important;transform:none!important;box-shadow:none!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}}
</style></head><body>
<div class="toolbar"><div class="bar"><div class="brand"><strong>Kyara · XV Mesas</strong><small>Editor 24 × 36 pulgadas</small></div>
<label class="filebtn">Importar Excel / CSV <input type="file" id="file" accept=".xlsx,.xls,.csv"></label>
<button id="template">Plantilla CSV</button><button id="reset">Restablecer</button><button class="primary" id="print">Imprimir / PDF</button></div>
<div class="bar" style="margin-top:10px"><input type="url" id="url" placeholder="Enlace CSV público de Google Sheets"><button id="connect">Vincular Google Sheets</button><span style="font-size:12px;color:#777">Actualizar nuevamente para cargar cambios.</span></div></div>
<div class="status" id="status">14 mesas redondas · 10 lugares por mesa · Vista preliminar</div><div id="stage"><div id="viewport"><div id="poster">
<div class="paper"></div><div class="frame"></div><div class="frame inner"></div>
<svg class="botanical tl" viewBox="0 0 600 800" aria-hidden="true"><defs><g id="petal"><path d="M0,-9 Q-87,-158 0,-257 Q93,-146 0,-9Z" fill="#fffefa" stroke="#c9b7a1" stroke-width="3"/><path d="M0,-23L0,-232" stroke="#ded4c7" stroke-width="3" fill="none"/></g><g id="leaf"><path d="M0,0Q70,-83 155,-54Q92,21 0,0Z" fill="#b5b9ad" stroke="#8b9489" stroke-width="3"/></g></defs><path d="M-30,450Q200,180 590,20 M-30,290Q225,300 460,740" fill="none" stroke="#ad8d62" stroke-width="7"/><g transform="translate(190 250) scale(.63)"><use href="#petal"/><use href="#petal" transform="rotate(45)"/><use href="#petal" transform="rotate(90)"/><use href="#petal" transform="rotate(135)"/><use href="#petal" transform="rotate(180)"/><use href="#petal" transform="rotate(225)"/><use href="#petal" transform="rotate(270)"/><use href="#petal" transform="rotate(315)"/><circle r="34" fill="#c8a477"/><circle r="17" fill="#eee2d0"/></g><g opacity=".8"><use href="#leaf" transform="translate(195 300) rotate(55)"/><use href="#leaf" transform="translate(120 385) rotate(125)"/><use href="#leaf" transform="translate(300 178) rotate(15)"/><use href="#leaf" transform="translate(96 455) rotate(90)"/></g><g fill="#fff" stroke="#b89d7e" stroke-width="2"><circle cx="385" cy="115" r="21"/><circle cx="418" cy="94" r="17"/><circle cx="447" cy="150" r="15"/><circle cx="120" cy="475" r="21"/><circle cx="168" cy="509" r="18"/><circle cx="100" cy="530" r="16"/></g><g fill="#bea17d"><circle cx="342" cy="154" r="12"/><circle cx="465" cy="180" r="10"/><circle cx="210" cy="532" r="12"/></g></svg>
<svg class="botanical br" viewBox="0 0 600 800" aria-hidden="true"><defs><g id="bp"><path d="M0,-9Q-87,-158 0,-257Q93,-146 0,-9Z" fill="#fffefa" stroke="#c9b7a1" stroke-width="3"/></g><g id="bl"><path d="M0,0Q70,-83 155,-54Q92,21 0,0Z" fill="#b4b9ae" stroke="#8b938a" stroke-width="3"/></g></defs><path d="M-30,450Q200,180 590,20 M-30,290Q225,300 460,740" fill="none" stroke="#ad8d62" stroke-width="7"/><g transform="translate(190 250) scale(.63)"><use href="#bp"/><use href="#bp" transform="rotate(45)"/><use href="#bp" transform="rotate(90)"/><use href="#bp" transform="rotate(135)"/><use href="#bp" transform="rotate(180)"/><use href="#bp" transform="rotate(225)"/><use href="#bp" transform="rotate(270)"/><use href="#bp" transform="rotate(315)"/><circle r="34" fill="#c8a477"/><circle r="17" fill="#eee2d0"/></g><use href="#bl" transform="translate(195 300) rotate(55)"/><use href="#bl" transform="translate(120 385) rotate(125)"/><use href="#bl" transform="translate(300 178) rotate(15)"/><g fill="#fff" stroke="#b89d7e" stroke-width="2"><circle cx="385" cy="115" r="21"/><circle cx="418" cy="94" r="17"/><circle cx="447" cy="150" r="15"/><circle cx="120" cy="475" r="21"/><circle cx="168" cy="509" r="18"/></g></svg>
<div class="dec top">❄</div><div class="dec right">✧</div><div class="dec left">❄</div><div class="dec bottom">❄</div>
<header class="head"><div class="kicker">MIS XV AÑOS</div><div class="script">Kyara</div><h1>Asignación de Mesas</h1><div class="rule"></div><div class="date">19 de diciembre de 2026 · Jardín Blanc</div></header>
<section class="serp"><label>MESA SERPENTINA</label><svg viewBox="0 0 430 105"><path d="M20 40 Q95 5 150 55 T285 55 T410 42" fill="none" stroke="#b39a78" stroke-width="3"/><g fill="#fffaf1" stroke="#b39a78" stroke-width="2"><circle cx="38" cy="18" r="12"/><circle cx="80" cy="13" r="12"/><circle cx="123" cy="25" r="12"/><circle cx="175" cy="78" r="12"/><circle cx="221" cy="75" r="12"/><circle cx="265" cy="40" r="12"/><circle cx="308" cy="18" r="12"/><circle cx="355" cy="22" r="12"/><circle cx="399" cy="26" r="12"/></g></svg><small>Según distribución original</small></section>
<div class="aisle">ÁREA CENTRAL</div><div id="tables"></div><footer class="foot"><div class="sig">Kyara</div><div class="txt">Zona Río · Tijuana</div></footer>
</div></div></div>
<script>
'use strict';
const positions={3:[130,1130],2:[560,1080],9:[1324,1080],10:[1755,1130],5:[130,1650],4:[560,1600],11:[1324,1600],12:[1755,1650],7:[130,2170],6:[560,2120],13:[1324,2120],14:[1755,2170],8:[365,2660],15:[1520,2660]};
const tables=Object.keys(positions).map(Number).sort((a,b)=>a-b);let data={},source='Ejemplo';
function example(){data={};tables.forEach(n=>data[n]=Array.from({length:10},()=> 'Nombre Apellido'));source='Ejemplo';render()}
function render(){const el=document.querySelector('#tables');el.innerHTML='';let count=0,over=[],empty=[];for(const n of tables){const list=data[n]||[];count+=list.length;if(list.length>10)over.push(n);if(list.length<10)empty.push(n);const d=document.createElement('section');d.className='table'+(list.length>10?' over':'');d.style.left=positions[n][0]+'px';d.style.top=positions[n][1]+'px';const title=document.createElement('h2');title.textContent='Mesa '+n;d.appendChild(title);const ol=document.createElement('ol');for(let i=0;i<10;i++){const li=document.createElement('li');const small=document.createElement('small');small.textContent=(i+1)+'.';li.append(small,document.createTextNode(list[i]||'—'));ol.appendChild(li)}d.appendChild(ol);el.appendChild(d)}document.querySelector('#status').textContent='14 mesas · '+count+' invitados · 140 lugares · '+source+(over.length?' · EXCESO: '+over.join(', '):'')+(empty.length&&source!=='Ejemplo'?' · Incompletas: '+empty.join(', '):'')}
function fit(){const v=document.querySelector('#viewport');const p=document.querySelector('#poster');const sc=Math.min(v.clientWidth/2304,.55);p.style.transform='translateX(-50%) scale('+sc+')';v.style.height=Math.ceil(3456*sc)+'px'}
function parseCSV(text){const rows=[];let row=[],value='',q=false;for(let i=0;i<text.length;i++){let ch=text[i];if(ch==='"'){if(q&&text[i+1]==='"'){value+='"';i++}else q=!q}else if(ch===','&&!q){row.push(value);value=''}else if((ch==='\r'||ch==='\n')&&!q){if(ch==='\r'&&text[i+1]==='\n')i++;row.push(value);if(row.some(v=>v.trim()))rows.push(row);row=[];value=''}else value+=ch}row.push(value);if(row.some(v=>v.trim()))rows.push(row);return rows}
function ingest(rows,label){if(!rows.length)throw Error('Archivo sin datos');const keys=rows[0].map(v=>String(v||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim());const ni=keys.findIndex(x=>['nombre','name','guest','invitado','nombre completo'].includes(x)),ti=keys.findIndex(x=>['mesa','table','table number','numero de mesa','mesa asignada'].includes(x));if(ni<0||ti<0)throw Error('Se necesitan columnas Nombre y Mesa');const next={};tables.forEach(n=>next[n]=[]);let skipped=0;for(const row of rows.slice(1)){const name=String(row[ni]??'').trim();if(!name)continue;const num=Number(String(row[ti]??'').match(/\d+/)?.[0]);if(!tables.includes(num)){skipped++;continue}next[num].push(name)}data=next;source=label+(skipped?' · '+skipped+' sin mesa válida':'');render()}
document.querySelector('#file').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{let rows;if(f.name.toLowerCase().endsWith('.csv'))rows=parseCSV((await f.text()).replace(/^\uFEFF/,''));else if(window.XLSX){const wb=XLSX.read(await f.arrayBuffer(),{type:'array'});rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:''})}else throw Error('No se pudo cargar Excel. Usa CSV.');ingest(rows,f.name)}catch(err){alert(err.message)}};
document.querySelector('#connect').onclick=async()=>{try{let url=new URL(document.querySelector('#url').value);if(url.hostname==='docs.google.com'&&url.pathname.includes('/spreadsheets/d/')){const id=url.pathname.match(/\/d\/([^/]+)/)[1];const gid=url.searchParams.get('gid')||url.hash.match(/gid=(\d+)/)?.[1]||'0';url=new URL('https://docs.google.com/spreadsheets/d/'+id+'/export?format=csv&gid='+gid)}const res=await fetch(url);if(!res.ok)throw Error('Error HTTP '+res.status);const text=await res.text();if(/<html/i.test(text.slice(0,200)))throw Error('Publica la hoja como CSV público');ingest(parseCSV(text),'Google Sheets')}catch(err){alert('No se pudo importar: '+err.message)}};
document.querySelector('#template').onclick=()=>{const rows=[['Nombre','Mesa']];tables.forEach(n=>Array.from({length:10},(_,i)=>rows.push(['Nombre Apellido',n])));const text='\uFEFF'+rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\r\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:'text/csv;charset=utf-8'}));a.download='Kyara_Plantilla_Invitados.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)};
document.querySelector('#reset').onclick=example;document.querySelector('#print').onclick=()=>window.print();window.addEventListener('resize',fit);example();fit();
</script></body></html>
