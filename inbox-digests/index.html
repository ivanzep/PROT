<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Inbox Digest Archive</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>
  // Apply any saved theme choice before first paint to avoid a flash of the wrong theme.
  (function () {
    var stored = localStorage.getItem('inboxDigestTheme');
    if (stored === 'light' || stored === 'dark') {
      document.documentElement.setAttribute('data-theme', stored);
    }
  })();
</script>
<style>
  :root {
    --bg: #f6f7f9;
    --card-bg: #ffffff;
    --panel-bg: #ffffff;
    --text: #1a1d23;
    --muted: #6b7280;
    --border: #e5e7eb;
    --accent: #2563eb;
    --accent-bg: #eff6ff;
    --btn-bg: #ffffff;
    --btn-bg-hover: #f3f4f6;
    --urgent: #dc2626;
    --action: #d97706;
    --fyi: #2563eb;
    --low: #6b7280;
    --chip-bg: #f3f4f6;
    --chip-text: #374151;
    --chip-active-bg: #2563eb;
    --chip-active-text: #ffffff;
    --input-bg: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14161a;
      --card-bg: #1e2128;
      --panel-bg: #1e2128;
      --text: #e8eaed;
      --muted: #9aa1ac;
      --border: #2c3038;
      --accent: #5b9bff;
      --accent-bg: #142338;
      --btn-bg: #262a32;
      --btn-bg-hover: #2f333c;
      --chip-bg: #262a32;
      --chip-text: #c7cbd1;
      --input-bg: #1e2128;
    }
  }
  :root[data-theme="dark"] {
    --bg: #14161a; --card-bg: #1e2128; --panel-bg: #1e2128; --text: #e8eaed; --muted: #9aa1ac; --border: #2c3038;
    --accent: #5b9bff; --accent-bg: #142338; --btn-bg: #262a32; --btn-bg-hover: #2f333c;
    --chip-bg: #262a32; --chip-text: #c7cbd1; --input-bg: #1e2128;
  }
  :root[data-theme="light"] {
    --bg: #f6f7f9; --card-bg: #ffffff; --panel-bg: #ffffff; --text: #1a1d23; --muted: #6b7280; --border: #e5e7eb;
    --accent: #2563eb; --accent-bg: #eff6ff; --btn-bg: #ffffff; --btn-bg-hover: #f3f4f6;
    --chip-bg: #f3f4f6; --chip-text: #374151; --input-bg: #ffffff;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.5;
    display: flex;
    flex-direction: column;
  }

  .body-wrap { flex: 1; display: flex; min-height: 0; }
  .sidebar {
    width: 260px;
    flex-shrink: 0;
    background: var(--panel-bg);
    border-right: 1px solid var(--border);
    overflow-y: auto;
    padding: 20px 18px;
    display: flex;
    flex-direction: column;
    gap: 22px;
  }
  .sidebar-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
  .sidebar-title { font-size: 1.05rem; font-weight: 700; margin: 0; }
  .sidebar-sub { font-size: 0.78rem; color: var(--muted); }
  .theme-toggle-btn {
    background: var(--btn-bg); border: 1px solid var(--border); color: var(--text);
    border-radius: 6px; padding: 5px 8px; font-size: 0.9rem; cursor: pointer; font-family: inherit;
    line-height: 1; flex-shrink: 0;
  }
  .theme-toggle-btn:hover { background: var(--btn-bg-hover); }
  .filter-group { display: flex; flex-direction: column; gap: 8px; }
  .filter-group label {
    font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.04em;
    color: var(--muted); font-weight: 600;
  }
  .date-inputs { display: flex; flex-direction: column; align-items: stretch; gap: 6px; }
  .date-inputs input[type="date"] {
    background: var(--input-bg); color: var(--text); border: 1px solid var(--border);
    border-radius: 6px; padding: 6px 8px; font-size: 0.85rem; font-family: inherit; width: 100%;
  }
  .date-inputs span { color: var(--muted); font-size: 0.82rem; }
  .shortcut-btns { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 2px; }
  .shortcut-btn {
    background: var(--chip-bg); color: var(--chip-text); border: 1px solid var(--border);
    border-radius: 999px; padding: 4px 10px; font-size: 0.75rem; cursor: pointer; font-family: inherit;
  }
  .shortcut-btn:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
  .shortcut-btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .section-toggles { display: flex; flex-direction: column; gap: 6px; }
  .section-toggle {
    display: flex; align-items: center; gap: 8px; font-size: 0.85rem; cursor: pointer; user-select: none;
  }
  .section-toggle input { cursor: pointer; }
  .label-chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip {
    background: var(--chip-bg); color: var(--chip-text); border: 1px solid var(--border);
    border-radius: 999px; padding: 4px 12px; font-size: 0.78rem; cursor: pointer;
    user-select: none; white-space: nowrap;
  }
  .chip.active { background: var(--chip-active-bg); color: var(--chip-active-text); border-color: var(--chip-active-bg); }
  .reset-btn {
    background: none; border: 1px solid var(--border); color: var(--muted);
    border-radius: 6px; padding: 7px 14px; font-size: 0.82rem; cursor: pointer; font-family: inherit;
    width: 100%;
  }
  .reset-btn:hover { color: var(--text); border-color: var(--muted); }
  .filter-status { font-size: 0.8rem; color: var(--muted); }

  .report-nav { display: flex; align-items: center; gap: 8px; }
  .report-nav-btn {
    background: var(--btn-bg); border: 1px solid var(--border); color: var(--text);
    border-radius: 6px; padding: 5px 10px; font-size: 0.8rem; cursor: pointer; font-family: inherit;
  }
  .report-nav-btn:hover:not(:disabled) { background: var(--btn-bg-hover); }
  .report-nav-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .report-position { font-size: 0.78rem; color: var(--muted); flex: 1; text-align: center; }
  .sources-list { display: flex; flex-direction: column; gap: 2px; }
  .sources-list a {
    font-size: 0.82rem; color: var(--text); text-decoration: none; cursor: pointer;
    padding: 4px 6px; border-radius: 5px;
  }
  .sources-list a:hover { color: var(--accent); background: var(--btn-bg-hover); }
  .sources-list a.active { color: var(--accent); font-weight: 600; background: var(--accent-bg); }

  main { flex: 1; min-width: 0; overflow-y: auto; }
  .wrap { max-width: 880px; margin: 0 auto; padding: 32px 20px 80px; }

  @media (max-width: 720px) {
    .body-wrap { flex-direction: column; }
    .sidebar { width: 100%; border-right: none; border-bottom: 1px solid var(--border); }
  }

  .state-msg {
    color: var(--muted); font-size: 0.95rem; text-align: center; padding: 60px 20px;
  }
  .state-msg.error { color: var(--urgent); }

  .section { margin-bottom: 36px; }
  .section-head { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
  .section-head .collapse-btn {
    margin-left: auto; background: none; border: 1px solid var(--border); color: var(--muted);
    border-radius: 6px; padding: 3px 10px; font-size: 0.75rem; cursor: pointer; font-family: inherit;
  }
  .section-head .collapse-btn:hover { color: var(--text); border-color: var(--muted); }
  .section-head h2 { font-size: 1.05rem; margin: 0; }
  .section-body.collapsed { display: none; }
  .count-pill {
    font-size: 0.75rem; font-weight: 600; padding: 2px 9px; border-radius: 999px;
    color: #fff; min-width: 18px; text-align: center; display: inline-block;
  }
  .pill-urgent { background: var(--urgent); }
  .pill-action { background: var(--action); }
  .pill-fyi { background: var(--fyi); }
  .pill-low { background: var(--low); }
  .card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 18px 20px;
    margin-bottom: 12px;
  }
  .card.urgent { border-left: 4px solid var(--urgent); }
  .card.action { border-left: 4px solid var(--action); }
  .card.fyi { border-left: 4px solid var(--fyi); }
  .card.low { border-left: 4px solid var(--low); }
  .card-top {
    display: flex; justify-content: space-between; align-items: baseline; flex-wrap: wrap; gap: 6px;
    margin-bottom: 6px;
  }
  .subject { font-weight: 600; font-size: 1rem; }
  .meta { font-size: 0.82rem; color: var(--muted); }
  .summary { margin: 8px 0; }
  .labels-row { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }
  .label-tag {
    font-size: 0.72rem; background: var(--chip-bg); color: var(--chip-text);
    border-radius: 5px; padding: 2px 8px; border: 1px solid var(--border);
  }
  .thread-link { font-size: 0.85rem; }
  .thread-link a { color: var(--fyi); text-decoration: none; }
  .thread-link a:hover { text-decoration: underline; }
  .draft {
    margin-top: 12px;
    background: var(--bg);
    border: 1px dashed var(--border);
    border-radius: 8px;
    padding: 12px 14px;
    font-size: 0.9rem;
    white-space: pre-wrap;
  }
  .draft-label { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); margin-bottom: 6px; font-weight: 600; }
  .empty { color: var(--muted); font-style: italic; padding: 8px 0; }
</style>
</head>
<body>
<div class="body-wrap">
  <nav class="sidebar">
    <div>
      <div class="sidebar-header">
        <div class="sidebar-title">Inbox Digest Archive</div>
        <button class="theme-toggle-btn" id="themeToggleBtn" title="Toggle light/dark mode">&#9728;&#65039;</button>
      </div>
      <div class="sidebar-sub" id="sourcesSummary">Loading…</div>
    </div>
    <div class="filter-group">
      <label>Report</label>
      <div class="report-nav">
        <button class="report-nav-btn" id="prevReportBtn" disabled title="Older report">&larr;</button>
        <span class="report-position" id="reportPosition"></span>
        <button class="report-nav-btn" id="nextReportBtn" disabled title="Newer report">&rarr;</button>
      </div>
      <div class="sources-list" id="sourcesList"></div>
    </div>
    <div class="filter-group">
      <label for="dateFrom">Date range</label>
      <div class="date-inputs">
        <input type="date" id="dateFrom" disabled>
        <span>&ndash;</span>
        <input type="date" id="dateTo" disabled>
      </div>
      <div class="shortcut-btns" id="dateShortcuts">
        <button class="shortcut-btn" data-days="7" disabled>Last week</button>
        <button class="shortcut-btn" data-days="14" disabled>Last 2 weeks</button>
        <button class="shortcut-btn" data-days="30" disabled>Last month</button>
      </div>
    </div>
    <div class="filter-group">
      <label>Labels</label>
      <div class="label-chips" id="labelChips"></div>
    </div>
    <div class="filter-group">
      <label>Sections</label>
      <div class="section-toggles" id="sectionToggles"></div>
    </div>
    <button class="reset-btn" id="resetBtn" disabled>Reset filters</button>
    <div class="filter-status" id="filterStatus"></div>
  </nav>

  <main>
    <div class="wrap" id="content">
      <div class="state-msg" id="stateMsg">Loading digest reports…</div>
    </div>
  </main>
</div>

<script>
  // Add each new digest report here as it's created — kept in ascending
  // (oldest → newest) date order. `date` drives the sort; `file` is the
  // path relative to this index. Each report's cards are fetched and
  // merged into this page at load time.
  const REPORTS = [
    { date: '2026-07-27', file: '2026-07-27-inbox-digest.html', label: 'Jul 27, 2026' },
    { date: '2026-07-28', file: '2026-07-28-inbox-digest.html', label: 'Jul 28, 2026' },
    { date: '2026-07-29', file: '2026-07-29-inbox-digest.html', label: 'Jul 29, 2026' },
    { date: '2026-07-30', file: '2026-07-30-inbox-digest.html', label: 'Jul 30, 2026' },
    { date: '2026-08-04', file: '2026-08-04-inbox-digest.html', label: 'Aug 4, 2026' },
    { date: '2026-08-05', file: '2026-08-05-inbox-digest.html', label: 'Aug 5, 2026' },
    { date: '2026-08-06', file: '2026-08-06-inbox-digest.html', label: 'Aug 6, 2026' },
    { date: '2026-08-13', file: '2026-08-13-inbox-digest.html', label: 'Aug 13, 2026' },
  ];

  REPORTS.sort((a, b) => a.date.localeCompare(b.date));

  const SECTIONS = [
    { key: 'urgent', label: 'Urgent' },
    { key: 'action', label: 'Action Needed' },
    { key: 'fyi', label: 'FYI' },
    { key: 'low', label: 'Low Priority' },
  ];

  const dateFrom = document.getElementById('dateFrom');
  const dateTo = document.getElementById('dateTo');
  const dateShortcuts = document.getElementById('dateShortcuts');
  const labelChipsWrap = document.getElementById('labelChips');
  const sectionTogglesWrap = document.getElementById('sectionToggles');
  const resetBtn = document.getElementById('resetBtn');
  const filterStatus = document.getElementById('filterStatus');
  const sourcesSummary = document.getElementById('sourcesSummary');
  const sourcesList = document.getElementById('sourcesList');
  const prevReportBtn = document.getElementById('prevReportBtn');
  const nextReportBtn = document.getElementById('nextReportBtn');
  const reportPosition = document.getElementById('reportPosition');
  const themeToggleBtn = document.getElementById('themeToggleBtn');
  const content = document.getElementById('content');
  const stateMsg = document.getElementById('stateMsg');

  let DEFAULT_FROM = '';
  let DEFAULT_TO = '';
  let activeLabels = new Set(); // empty set = no label filter applied (show all)
  let hiddenSections = new Set(); // section keys the user has hidden entirely
  let allCards = []; // every card from every successfully loaded report
  let cards = []; // cards belonging to the currently selected report only
  let loadedReports = []; // reports that loaded successfully, oldest -> newest
  let selectedReportDate = '';

  function toISODate(d) {
    return d.toISOString().slice(0, 10);
  }

  // Collapse a label to its first 2 path levels, e.g.
  // "PROJECTS/LA COSTA/LENDERS & ADMIN" -> "PROJECTS/LA COSTA".
  function labelPrefix(l) {
    return l.split('/').slice(0, 2).join('/');
  }

  const THEME_KEY = 'inboxDigestTheme';

  function currentTheme() {
    const stored = localStorage.getItem(THEME_KEY);
    if (stored === 'light' || stored === 'dark') return stored;
    return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  }

  function applyTheme(theme) {
    document.documentElement.setAttribute('data-theme', theme);
    themeToggleBtn.textContent = theme === 'dark' ? '☀️' : '🌙';
    themeToggleBtn.title = theme === 'dark' ? 'Switch to light mode' : 'Switch to dark mode';
    localStorage.setItem(THEME_KEY, theme);
  }

  applyTheme(currentTheme());
  themeToggleBtn.addEventListener('click', () => {
    applyTheme(currentTheme() === 'dark' ? 'light' : 'dark');
  });

  prevReportBtn.addEventListener('click', () => {
    const idx = loadedReports.findIndex(r => r.date === selectedReportDate);
    if (idx > 0) selectReport(loadedReports[idx - 1].date);
  });
  nextReportBtn.addEventListener('click', () => {
    const idx = loadedReports.findIndex(r => r.date === selectedReportDate);
    if (idx >= 0 && idx < loadedReports.length - 1) selectReport(loadedReports[idx + 1].date);
  });

  async function loadReports() {
    if (REPORTS.length === 0) {
      stateMsg.textContent = 'No reports found.';
      sourcesSummary.textContent = 'No reports yet';
      return;
    }

    const results = await Promise.allSettled(REPORTS.map(r => fetchReportCards(r)));

    const failedReports = [];
    results.forEach((res, i) => {
      if (res.status === 'fulfilled') {
        loadedReports.push(REPORTS[i]);
        allCards.push(...res.value);
      } else {
        failedReports.push(REPORTS[i]);
      }
    });

    if (loadedReports.length === 0) {
      stateMsg.className = 'state-msg error';
      stateMsg.textContent = 'Could not load any digest reports. This page fetches report files over HTTP, ' +
        'so it needs to be served (e.g. via GitHub Pages or a local static server) rather than opened directly as a file://.';
      sourcesSummary.textContent = 'Failed to load';
      return;
    }

    if (failedReports.length > 0) {
      const warn = document.createElement('div');
      warn.className = 'sidebar-sub';
      warn.textContent = 'Failed to load: ' + failedReports.map(r => r.label).join(', ');
      sourcesList.appendChild(warn);
    }

    selectedReportDate = loadedReports[loadedReports.length - 1].date; // default to newest
    renderReportSelector();
    selectReport(selectedReportDate);
  }

  function renderReportSelector() {
    sourcesList.querySelectorAll('a').forEach(el => el.remove());
    loadedReports.forEach(r => {
      const a = document.createElement('a');
      a.href = '#';
      a.dataset.date = r.date;
      a.className = r.date === selectedReportDate ? 'active' : '';
      a.textContent = r.label;
      a.addEventListener('click', (e) => {
        e.preventDefault();
        selectReport(r.date);
      });
      sourcesList.appendChild(a);
    });

    const idx = loadedReports.findIndex(r => r.date === selectedReportDate);
    reportPosition.textContent = (idx + 1) + ' of ' + loadedReports.length;
    prevReportBtn.disabled = idx <= 0;
    nextReportBtn.disabled = idx < 0 || idx >= loadedReports.length - 1;
  }

  function selectReport(date) {
    selectedReportDate = date;
    cards = allCards.filter(c => c.reportDate === date);
    activeLabels.clear();
    hiddenSections.clear();

    const report = loadedReports.find(r => r.date === date);
    sourcesSummary.textContent = (report ? report.label : date) + ' · ' + cards.length + ' unread emails' +
      (loadedReports.length > 1 ? ' · report ' + (loadedReports.findIndex(r => r.date === date) + 1) + ' of ' + loadedReports.length : '');

    renderReportSelector();
    buildContent();
  }

  async function fetchReportCards(report) {
    const res = await fetch(report.file);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const html = await res.text();
    const doc = new DOMParser().parseFromString(html, 'text/html');
    const out = [];
    doc.querySelectorAll('.section[data-section] .card').forEach(cardEl => {
      const section = cardEl.closest('.section[data-section]').dataset.section;
      out.push({
        section,
        date: cardEl.dataset.date || '',
        labels: (cardEl.dataset.labels || '').split('|').filter(Boolean),
        node: cardEl.cloneNode(true),
        sourceReport: report.label,
        reportDate: report.date,
      });
    });
    return out;
  }

  function buildContent() {
    content.innerHTML = '';

    SECTIONS.forEach(sec => {
      const sectionEl = document.createElement('div');
      sectionEl.className = 'section';
      sectionEl.dataset.section = sec.key;

      const bodyId = 'body-' + sec.key;
      sectionEl.innerHTML =
        '<div class="section-head">' +
          '<span class="count-pill pill-' + sec.key + '" id="count-' + sec.key + '"></span>' +
          '<h2>' + sec.label + '</h2>' +
          '<button class="collapse-btn" data-target="' + bodyId + '">Collapse</button>' +
        '</div>' +
        '<div class="section-body" id="' + bodyId + '"></div>';

      content.appendChild(sectionEl);
    });

    cards.filter(c => SECTIONS.some(s => s.key === c.section)).forEach(c => {
      const body = document.getElementById('body-' + c.section);
      body.appendChild(c.node);
    });

    // Date range across all loaded cards.
    const dates = cards.map(c => c.date).filter(Boolean).sort();
    DEFAULT_FROM = dates[0] || '';
    DEFAULT_TO = dates[dates.length - 1] || '';
    dateFrom.value = DEFAULT_FROM;
    dateTo.value = DEFAULT_TO;
    dateFrom.disabled = false;
    dateTo.disabled = false;
    resetBtn.disabled = false;
    dateShortcuts.querySelectorAll('.shortcut-btn').forEach(btn => { btn.disabled = false; });

    sectionTogglesWrap.innerHTML = '';
    SECTIONS.forEach(sec => {
      const id = 'section-toggle-' + sec.key;
      const wrap = document.createElement('label');
      wrap.className = 'section-toggle';
      wrap.innerHTML = '<input type="checkbox" id="' + id + '" checked> ' + sec.label;
      wrap.querySelector('input').addEventListener('change', (e) => {
        if (e.target.checked) hiddenSections.delete(sec.key);
        else hiddenSections.add(sec.key);
        applyFilters();
      });
      sectionTogglesWrap.appendChild(wrap);
    });

    // Discover all distinct label prefixes (first 2 levels), in first-seen order.
    const allLabels = [];
    cards.forEach(c => {
      c.labels.forEach(l => {
        const prefix = labelPrefix(l);
        if (!allLabels.includes(prefix)) allLabels.push(prefix);
      });
    });

    labelChipsWrap.innerHTML = '';
    allLabels.forEach(label => {
      const chip = document.createElement('span');
      chip.className = 'chip';
      chip.textContent = label;
      chip.addEventListener('click', () => {
        if (activeLabels.has(label)) {
          activeLabels.delete(label);
          chip.classList.remove('active');
        } else {
          activeLabels.add(label);
          chip.classList.add('active');
        }
        applyFilters();
      });
      labelChipsWrap.appendChild(chip);
    });

    document.querySelectorAll('.collapse-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const body = document.getElementById(btn.dataset.target);
        const collapsed = body.classList.toggle('collapsed');
        btn.textContent = collapsed ? 'Expand' : 'Collapse';
      });
    });

    applyFilters();
  }

  // One-time listeners for controls that persist across report switches
  // (buildContent() replaces the label chips / section toggles each time,
  // but these elements themselves are never recreated).
  dateFrom.addEventListener('change', applyFilters);
  dateTo.addEventListener('change', applyFilters);

  dateShortcuts.querySelectorAll('.shortcut-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      if (!DEFAULT_TO) return;
      const days = parseInt(btn.dataset.days, 10);
      const anchor = new Date(DEFAULT_TO + 'T00:00:00Z');
      const start = new Date(anchor);
      start.setUTCDate(start.getUTCDate() - (days - 1));
      dateFrom.value = toISODate(start);
      dateTo.value = DEFAULT_TO;
      applyFilters();
    });
  });

  resetBtn.addEventListener('click', () => {
    dateFrom.value = DEFAULT_FROM;
    dateTo.value = DEFAULT_TO;
    activeLabels.clear();
    labelChipsWrap.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
    hiddenSections.clear();
    sectionTogglesWrap.querySelectorAll('input').forEach(cb => { cb.checked = true; });
    applyFilters();
  });

  function applyFilters() {
    const from = dateFrom.value;
    const to = dateTo.value;
    const counts = { urgent: 0, action: 0, fyi: 0, low: 0 };
    let visibleTotal = 0;

    cards.forEach(c => {
      const d = c.date;
      const prefixes = c.labels.map(labelPrefix);
      const inRange = (!from || d >= from) && (!to || d <= to);
      const labelMatch = activeLabels.size === 0 || prefixes.some(l => activeLabels.has(l));
      const visible = inRange && labelMatch;
      c.node.style.display = visible ? '' : 'none';
      if (visible) {
        counts[c.section] = (counts[c.section] || 0) + 1;
        if (!hiddenSections.has(c.section)) visibleTotal++;
      }
    });

    let totalConsidered = 0;
    SECTIONS.forEach(sec => {
      const countEl = document.getElementById('count-' + sec.key);
      if (countEl) countEl.textContent = counts[sec.key] || 0;

      const sectionHidden = hiddenSections.has(sec.key);
      const sectionEl = content.querySelector('.section[data-section="' + sec.key + '"]');
      if (sectionEl) sectionEl.style.display = sectionHidden ? 'none' : '';
      if (!sectionHidden) totalConsidered += cards.filter(c => c.section === sec.key).length;

      const body = document.getElementById('body-' + sec.key);
      const hasVisibleCard = (counts[sec.key] || 0) > 0;
      let emptyMsg = body.querySelector('.empty-filtered');
      if (!sectionHidden && !hasVisibleCard) {
        if (!emptyMsg) {
          emptyMsg = document.createElement('div');
          emptyMsg.className = 'empty empty-filtered';
          emptyMsg.textContent = 'No emails in this category match the current filters.';
          body.appendChild(emptyMsg);
        }
      } else if (emptyMsg) {
        emptyMsg.remove();
      }
    });

    const filtersActive = from !== DEFAULT_FROM || to !== DEFAULT_TO || activeLabels.size > 0 || hiddenSections.size > 0;
    filterStatus.textContent = filtersActive
      ? 'Showing ' + visibleTotal + ' of ' + totalConsidered + ' emails matching current filters.'
      : 'Showing all ' + cards.length + ' unread emails.';
  }

  loadReports();
</script>
</body>
</html>
