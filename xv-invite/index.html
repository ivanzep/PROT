<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Invitación XV Años</title>
<style>
  /* Self-hosted, not a CDN link: files live in xv-invite/fonts/, both
     SIL Open Font License (free to bundle/redistribute). Great Vibes is a
     single weight; Playfair Display's file is a variable font, so one file
     covers both the 400 and 700 declared below. System-font fallbacks
     still follow each, in case the local files ever go missing. */
  @font-face {
    font-family: 'Great Vibes';
    font-style: normal;
    font-weight: 400;
    font-display: swap;
    src: url('fonts/great-vibes-regular.woff2') format('woff2');
  }
  @font-face {
    font-family: 'Playfair Display';
    font-style: normal;
    font-weight: 400 700;
    font-display: swap;
    src: url('fonts/playfair-display-regular.woff2') format('woff2');
  }
  @font-face {
    font-family: 'Playfair Display';
    font-style: italic;
    font-weight: 400;
    font-display: swap;
    src: url('fonts/playfair-display-italic.woff2') format('woff2');
  }

  :root {
    --gold: #b8935a;
    --gold-light: #d9bb85;
    --cream-line: #e3dac4;
    --cream-band: #ece0c8;
    --cream-bg: #f5f1e8;
    --ink: #3a332c;
    --ink-soft: #746a5b;
    --font-heading: 'Playfair Display', Georgia, 'Times New Roman', serif;
    --font-script: 'Great Vibes', 'Segoe Script', 'Brush Script MT', 'Lucida Handwriting', cursive;
    --font-body: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
    --decor-corner-img: url("data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 340 340%22><defs><g id=%22np%22><path d=%22M0 0 L-13 -7 M0 0 L13 -7%22 stroke=%22%238a9478%22 stroke-width=%221%22 fill=%22none%22 stroke-linecap=%22round%22/></g><g id=%22bl%22><g fill=%22%23faf6ee%22 stroke=%22%23b8935a%22 stroke-width=%220.9%22><ellipse cx=%220%22 cy=%22-25%22 rx=%2210.5%22 ry=%2223%22 transform=%22rotate%280%29%22/><ellipse cx=%220%22 cy=%22-25%22 rx=%2210.5%22 ry=%2223%22 transform=%22rotate%2851%29%22/><ellipse cx=%220%22 cy=%22-25%22 rx=%2210.5%22 ry=%2223%22 transform=%22rotate%28102%29%22/><ellipse cx=%220%22 cy=%22-25%22 rx=%2210.5%22 ry=%2223%22 transform=%22rotate%28153%29%22/><ellipse cx=%220%22 cy=%22-25%22 rx=%2210.5%22 ry=%2223%22 transform=%22rotate%28204%29%22/><ellipse cx=%220%22 cy=%22-25%22 rx=%2210.5%22 ry=%2223%22 transform=%22rotate%28255%29%22/><ellipse cx=%220%22 cy=%22-25%22 rx=%2210.5%22 ry=%2223%22 transform=%22rotate%28306%29%22/></g><circle cx=%220%22 cy=%220%22 r=%226.5%22 fill=%22%23e9d9b5%22 stroke=%22%23b8935a%22 stroke-width=%220.7%22/><circle cx=%22-3%22 cy=%22-2.5%22 r=%221.3%22 fill=%22%23c9a35e%22/><circle cx=%223.2%22 cy=%22-1.5%22 r=%221.3%22 fill=%22%23c9a35e%22/><circle cx=%220%22 cy=%223.2%22 r=%221.3%22 fill=%22%23c9a35e%22/><circle cx=%22-1.5%22 cy=%222%22 r=%221.1%22 fill=%22%23c9a35e%22/></g><g id=%22s4%22><path d=%22M0 -8 L2 -2 L8 0 L2 2 L0 8 L-2 2 L-8 0 L-2 -2 Z%22 fill=%22%23b8935a%22/></g></defs><path d=%22M10 5 C 50 70, 85 130, 125 195%22 stroke=%22%238a9478%22 stroke-width=%221.3%22 fill=%22none%22 stroke-linecap=%22round%22/><path d=%22M-5 45 C 25 95, 55 140, 80 200%22 stroke=%22%238a9478%22 stroke-width=%221.1%22 fill=%22none%22 stroke-linecap=%22round%22/><path d=%22M35 -5 C 60 40, 90 80, 115 125%22 stroke=%22%238a9478%22 stroke-width=%221%22 fill=%22none%22 stroke-linecap=%22round%22/><use href=%22%23np%22 x=%2230%22 y=%2248%22 transform=%22rotate%2855 30 48%29%22/><use href=%22%23np%22 x=%2242%22 y=%2265%22 transform=%22rotate%2855 42 65%29%22/><use href=%22%23np%22 x=%2255%22 y=%2285%22 transform=%22rotate%2855 55 85%29%22/><use href=%22%23np%22 x=%2267%22 y=%22103%22 transform=%22rotate%2855 67 103%29%22/><use href=%22%23np%22 x=%2280%22 y=%22122%22 transform=%22rotate%2855 80 122%29%22/><use href=%22%23np%22 x=%2293%22 y=%22140%22 transform=%22rotate%2855 93 140%29%22/><use href=%22%23np%22 x=%22105%22 y=%22158%22 transform=%22rotate%2855 105 158%29%22/><use href=%22%23np%22 x=%22116%22 y=%22178%22 transform=%22rotate%2855 116 178%29%22/><use href=%22%23np%22 x=%2210%22 y=%2278%22 transform=%22rotate%2855 10 78%29 scale%280.85%29%22/><use href=%22%23np%22 x=%2222%22 y=%2297%22 transform=%22rotate%2855 22 97%29 scale%280.85%29%22/><use href=%22%23np%22 x=%2234%22 y=%22116%22 transform=%22rotate%2855 34 116%29 scale%280.85%29%22/><use href=%22%23np%22 x=%2246%22 y=%22135%22 transform=%22rotate%2855 46 135%29 scale%280.85%29%22/><use href=%22%23np%22 x=%2258%22 y=%22154%22 transform=%22rotate%2855 58 154%29 scale%280.85%29%22/><use href=%22%23np%22 x=%2270%22 y=%22173%22 transform=%22rotate%2855 70 173%29 scale%280.85%29%22/><use href=%22%23np%22 x=%2250%22 y=%2220%22 transform=%22rotate%2850 50 20%29 scale%280.7%29%22/><use href=%22%23np%22 x=%2262%22 y=%2240%22 transform=%22rotate%2850 62 40%29 scale%280.7%29%22/><use href=%22%23np%22 x=%2274%22 y=%2260%22 transform=%22rotate%2850 74 60%29 scale%280.7%29%22/><use href=%22%23np%22 x=%2286%22 y=%2280%22 transform=%22rotate%2850 86 80%29 scale%280.7%29%22/><use href=%22%23np%22 x=%2298%22 y=%22100%22 transform=%22rotate%2850 98 100%29 scale%280.7%29%22/><circle cx=%2295%22 cy=%22155%22 r=%223%22 fill=%22%23efe6d2%22 stroke=%22%23b8935a%22 stroke-width=%220.6%22/><circle cx=%22108%22 cy=%22168%22 r=%222.5%22 fill=%22%23efe6d2%22 stroke=%22%23b8935a%22 stroke-width=%220.6%22/><circle cx=%2260%22 cy=%22130%22 r=%222.8%22 fill=%22%23efe6d2%22 stroke=%22%23b8935a%22 stroke-width=%220.6%22/><circle cx=%2245%22 cy=%22110%22 r=%222.2%22 fill=%22%23efe6d2%22 stroke=%22%23b8935a%22 stroke-width=%220.6%22/><circle cx=%22130%22 cy=%22200%22 r=%222.6%22 fill=%22%23efe6d2%22 stroke=%22%23b8935a%22 stroke-width=%220.6%22/><use href=%22%23bl%22 transform=%22translate%2855,55%29 scale%281.25%29%22/><use href=%22%23bl%22 transform=%22translate%28110,110%29 scale%280.8%29%22/><use href=%22%23bl%22 transform=%22translate%2830,120%29 scale%280.55%29%22/><use href=%22%23s4%22 transform=%22translate%28150,30%29 scale%280.8%29%22/><use href=%22%23s4%22 transform=%22translate%28170,70%29 scale%280.5%29%22/><use href=%22%23s4%22 transform=%22translate%2820,170%29 scale%280.6%29%22/></svg>");
    --decor-snowflake-img: url("data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 40 40%22 fill=%22none%22 stroke=%22%23b8935a%22 stroke-width=%221.3%22 stroke-linecap=%22round%22><g><line x1=%2220%22 y1=%224%22 x2=%2220%22 y2=%2236%22/><line x1=%2220%22 y1=%229%22 x2=%2215%22 y2=%2212%22/><line x1=%2220%22 y1=%229%22 x2=%2225%22 y2=%2212%22/><line x1=%2220%22 y1=%2231%22 x2=%2215%22 y2=%2228%22/><line x1=%2220%22 y1=%2231%22 x2=%2225%22 y2=%2228%22/></g><g transform=%22rotate%2860 20 20%29%22><line x1=%2220%22 y1=%224%22 x2=%2220%22 y2=%2236%22/><line x1=%2220%22 y1=%229%22 x2=%2215%22 y2=%2212%22/><line x1=%2220%22 y1=%229%22 x2=%2225%22 y2=%2212%22/><line x1=%2220%22 y1=%2231%22 x2=%2215%22 y2=%2228%22/><line x1=%2220%22 y1=%2231%22 x2=%2225%22 y2=%2228%22/></g><g transform=%22rotate%28120 20 20%29%22><line x1=%2220%22 y1=%224%22 x2=%2220%22 y2=%2236%22/><line x1=%2220%22 y1=%229%22 x2=%2215%22 y2=%2212%22/><line x1=%2220%22 y1=%229%22 x2=%2225%22 y2=%2212%22/><line x1=%2220%22 y1=%2231%22 x2=%2215%22 y2=%2228%22/><line x1=%2220%22 y1=%2231%22 x2=%2225%22 y2=%2228%22/></g><circle cx=%2220%22 cy=%2220%22 r=%221.4%22 fill=%22%23b8935a%22 stroke=%22none%22/></svg>");
    --decor-star-img: url("data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22 fill=%22%23b8935a%22><path d=%22M12 2 L13.5 10.5 L22 12 L13.5 13.5 L12 22 L10.5 13.5 L2 12 L10.5 10.5 Z%22/></svg>");
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: #e9e2d2;
    font-family: var(--font-body);
    color: var(--ink);
  }

  body {
    display: flex;
    justify-content: center;
    padding: 32px 12px;
    min-height: 100vh;
  }

  .site {
    position: relative;
    width: 100%;
    max-width: 460px;
    background: var(--cream-bg);
    overflow: hidden;
    box-shadow: 0 30px 60px -20px rgba(58, 51, 44, 0.3);
    border-radius: 6px;
  }

  /* ---------- decorative layers ---------- */
  /* Corner artwork (top/bottom bands + butterfly motif) is real photographic
     art the user supplied, cropped from a tall reference image and re-cut
     into pieces that stay correct at any page length: two bands anchored to
     the top/bottom edges (each fades to transparent on its inner edge so it
     blends into the plain card background beneath), plus one small butterfly
     motif reused at several scattered positions below. See DECOR_B64 for the
     embedded WebP data. */

  @keyframes ambientDrift {
    0%   { transform: translate(0, 0) scale(1); }
    50%  { transform: translate(3%, -2%) scale(1.06); }
    100% { transform: translate(-2%, 3%) scale(1); }
  }
  @keyframes twinkle {
    0%, 100% { opacity: 0.28; }
    50%      { opacity: 0.6; }
  }

  .ambient-glow {
    position: absolute;
    inset: -12%;
    z-index: 0;
    pointer-events: none;
    background:
      radial-gradient(circle at 22% 12%, rgba(184,147,90,0.26), transparent 42%),
      radial-gradient(circle at 88% 28%, rgba(184,147,90,0.18), transparent 38%),
      radial-gradient(circle at 25% 78%, rgba(184,147,90,0.22), transparent 40%),
      radial-gradient(circle at 90% 85%, rgba(184,147,90,0.14), transparent 36%);
    filter: blur(6px);
    animation: ambientDrift 20s ease-in-out infinite alternate;
  }

  .sparkles {
    position: absolute;
    inset: 0;
    pointer-events: none;
    opacity: 0.4;
    background-image:
      radial-gradient(circle, var(--gold-light) 1px, transparent 1.6px),
      radial-gradient(circle, var(--gold-light) 1px, transparent 1.6px);
    background-size: 140px 160px, 190px 210px;
    background-position: 10px 20px, 90px 120px;
    z-index: 0;
    animation: twinkle 4.5s ease-in-out infinite;
  }
  .sparkles.layer2 {
    background-size: 170px 130px, 220px 240px;
    background-position: 60px 80px, 150px 40px;
    animation-duration: 5.5s;
    animation-delay: -2s;
  }

  .corner-decor {
    position: absolute;
    width: 230px;
    aspect-ratio: 1;
    z-index: 0;
    pointer-events: none;
    background-image: var(--decor-corner-img);
    background-repeat: no-repeat;
    background-size: contain;
    opacity: 0.95;
  }
  .corner-decor.top-left { top: 0; left: 0; }
  .corner-decor.bottom-right { bottom: 0; right: 0; transform: rotate(180deg); }

  .snowflake, .star {
    position: absolute;
    z-index: 0;
    pointer-events: none;
    background-repeat: no-repeat;
    background-size: contain;
    background-position: center;
    animation: driftSway 7s ease-in-out infinite;
  }
  @keyframes driftSway {
    0%, 100% { transform: translateY(0) rotate(var(--r, 0deg)); }
    50%      { transform: translateY(-8px) rotate(calc(var(--r, 0deg) + 10deg)); }
  }
  .snowflake { width: 26px; aspect-ratio: 1; background-image: var(--decor-snowflake-img); opacity: 0.55; }
  .star { width: 14px; aspect-ratio: 1; background-image: var(--decor-star-img); opacity: 0.7; }

  .sf1 { top: 24%; left: 8%;  --r: -12deg; animation-delay: -0.4s; }
  .sf2 { top: 41%; right: 9%; --r: 18deg;  animation-delay: -2.1s; }
  .sf3 { top: 57%; left: 6%;  --r: 6deg;   animation-delay: -3.6s; }
  .sf4 { top: 63%; right: 8%; --r: -16deg; animation-delay: -1.3s; }
  .sf5 { top: 74%; left: 12%; --r: 10deg;  animation-delay: -4.5s; }
  .sf6 { top: 86%; right: 12%; --r: -8deg; animation-delay: -2.8s; }
  .sf7 { top: 14%; right: 14%; --r: 24deg; animation-delay: -1.8s; }
  .sf8 { top: 33%; left: 4%;  --r: -20deg; animation-delay: -3.2s; }
  .sf9 { top: 48%; right: 5%; --r: 12deg;  animation-delay: -0.9s; }

  .st1 { top: 18%; right: 20%; --r: 10deg;  animation-delay: -0.5s; }
  .st2 { top: 46%; left: 30%;  --r: -20deg; animation-delay: -2.4s; }
  .st3 { top: 52%; right: 30%; --r: 60deg;  animation-delay: -1.2s; }
  .st4 { top: 71%; left: 20%;  --r: 140deg; animation-delay: -3.1s; }
  .st5 { top: 82%; right: 15%; --r: -70deg; animation-delay: -1.7s; }

  @media (prefers-reduced-motion: reduce) {
    .ambient-glow, .sparkles, .snowflake, .star {
      animation: none !important;
    }
  }

  section {
    position: relative;
    z-index: 1;
    padding: 36px 26px;
  }

  .divider {
    position: relative;
    z-index: 1;
    height: 1px;
    margin: 0 26px;
    background: linear-gradient(to right, transparent, var(--cream-line), transparent);
  }
  .divider::after {
    content: '';
    position: absolute;
    top: 50%;
    left: 50%;
    width: 7px;
    height: 7px;
    background: var(--gold-light);
    transform: translate(-50%, -50%) rotate(45deg);
  }

  h2.eyebrow {
    margin: 0 0 4px;
    font-family: var(--font-heading);
    letter-spacing: 4px;
    font-size: 13px;
    text-transform: uppercase;
    color: var(--gold);
    text-align: center;
  }

  .script-heading {
    font-family: var(--font-script);
    color: var(--ink);
    text-align: center;
    font-size: 30px;
    margin: 0 0 18px;
  }

  /* ---------- hero ---------- */

  .hero { padding-top: 30px; text-align: center; }

  .hero-title {
    margin-top: 22px;
    font-family: var(--font-heading);
    letter-spacing: 8px;
    font-size: 15px;
    color: var(--gold);
  }

  .hero-name {
    font-family: var(--font-script);
    font-size: 56px;
    line-height: 1.1;
    margin: 4px 0 22px;
    color: var(--ink);
  }

  /* music player */
  .player {
    max-width: 240px;
    margin: 0 auto;
  }
  .player .song {
    font-size: 11px;
    color: var(--ink-soft);
    margin-bottom: 10px;
    letter-spacing: 0.3px;
  }
  .player-controls {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 18px;
  }
  .player-controls button {
    background: none;
    border: none;
    padding: 0;
    color: var(--ink);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .player-controls .play {
    width: 46px;
    height: 46px;
    border-radius: 50%;
    background: var(--gold);
    color: #fff;
  }
  .player-controls svg { width: 18px; height: 18px; }
  .player-controls .play svg { width: 16px; height: 16px; }
  .player-controls button:not(.play) svg { width: 20px; height: 20px; }

  /* ---------- quote ---------- */
  .quote {
    text-align: center;
    font-family: var(--font-heading);
    font-style: italic;
    font-size: 15px;
    line-height: 1.7;
    color: var(--ink);
    padding-bottom: 10px;
  }

  /* ---------- date + countdown ---------- */
  .date-section { text-align: center; padding-bottom: 0; }
  .event-date {
    font-family: var(--font-script);
    color: var(--ink);
    font-size: 42px;
    margin: 4px 0 26px;
  }

  .countdown-band {
    position: relative;
    z-index: 1;
    background: var(--cream-band);
    padding: 18px 10px;
    display: flex;
    justify-content: center;
    gap: 22px;
  }
  .countdown-band .unit { text-align: center; }
  .countdown-band .num {
    font-family: var(--font-heading);
    font-size: 24px;
    font-weight: bold;
    color: var(--ink);
  }
  .countdown-band .num.accent { color: var(--ink); }
  .countdown-band .label {
    font-size: 9px;
    letter-spacing: 1px;
    color: var(--ink-soft);
    text-transform: uppercase;
  }
  .countdown-caption {
    text-align: center;
    font-size: 11px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--ink-soft);
    padding-top: 14px;
  }

  /* ---------- location blocks ---------- */
  .location {
    text-align: center;
  }
  .location .icon {
    width: 34px;
    height: 34px;
    margin: 0 auto 10px;
    color: var(--gold);
  }
  .location .place-name {
    font-family: var(--font-script);
    font-size: 24px;
    color: var(--ink);
    margin: 0 0 2px;
  }
  .location .place-time {
    font-family: var(--font-heading);
    font-size: 14px;
    color: var(--ink);
    letter-spacing: 1px;
    margin-bottom: 14px;
  }
  .map-btn {
    display: inline-block;
    font-size: 12px;
    letter-spacing: 0.5px;
    color: var(--ink);
    text-decoration: none;
    background: #fff;
    border: 1px solid var(--cream-line);
    padding: 8px 20px;
    border-radius: 20px;
  }
  .map-btn:hover { background: var(--cream-band); }

  .venue-photo {
    width: 60%;
    max-width: 220px;
    aspect-ratio: 3/4;
    margin: 26px auto 0;
    border: 4px solid #fff;
    box-shadow: 0 12px 22px -12px rgba(60,45,20,0.4);
    background:
      radial-gradient(circle at 50% 20%, rgba(255,255,255,0.35), transparent 45%),
      linear-gradient(160deg, #cbb189, #a8875a 55%, #6e5638);
    overflow: hidden;
    position: relative;
  }
  .venue-photo svg { position: absolute; inset: 0; width: 100%; height: 100%; }

  /* itinerary timeline */
  .itinerary-title {
    font-family: var(--font-script);
    text-align: center;
    color: var(--ink);
    font-size: 26px;
    margin: 34px 0 46px;
  }
  .timeline {
    display: flex;
    justify-content: space-between;
    position: relative;
    margin: 0 4px 40px;
  }
  .timeline::before {
    content: '';
    position: absolute;
    left: 4%;
    right: 4%;
    top: 50%;
    height: 1.5px;
    background: var(--cream-line);
  }
  .timeline .stop {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 9px;
    position: relative;
    z-index: 1;
  }
  .timeline .stop.top { transform: translateY(-30px); }
  .timeline .stop.bottom { transform: translateY(30px); flex-direction: column-reverse; }
  .timeline .stop .icon { width: 30px; height: 30px; color: var(--ink); }
  .timeline .stop .dot {
    width: 13px; height: 13px; border-radius: 50%;
    background: var(--gold); border: 3px solid #fff;
    box-shadow: 0 0 0 1px var(--cream-line);
  }
  .timeline .stop .stop-label {
    font-size: 13px;
    text-align: center;
    color: var(--ink);
    line-height: 1.5;
  }
  .timeline .stop .stop-time { color: var(--ink); font-weight: 600; font-size: 13.5px; }

  /* ---------- dress code ---------- */
  .dresscode { text-align: center; }
  .dresscode-icons {
    display: flex;
    justify-content: center;
    gap: 28px;
    margin: 10px 0 8px;
  }
  .dresscode-icons svg { width: 46px; height: 46px; color: var(--ink); }
  .dresscode-label {
    font-size: 13px;
    letter-spacing: 3px;
    color: var(--ink);
  }

  /* ---------- gift ---------- */
  .gift { text-align: center; }
  .gift .icon { width: 34px; height: 34px; margin: 0 auto 12px; color: var(--gold); }
  .gift p {
    font-size: 13px;
    line-height: 1.7;
    color: var(--ink);
    max-width: 300px;
    margin: 0 auto 20px;
  }
  .gift-band {
    background: var(--cream-band);
    color: var(--ink);
    text-decoration: none;
    display: block;
    padding: 14px;
    font-size: 13px;
    letter-spacing: 2px;
    font-weight: 600;
  }
  .gift-band:hover { background: var(--cream-line); }

  /* ---------- rsvp ---------- */
  .rsvp { text-align: center; }
  .rsvp .script-heading { margin-bottom: 16px; }
  .rsvp .icon { width: 34px; height: 34px; margin: 0 auto 12px; color: var(--gold); }
  .rsvp p { font-size: 13px; color: var(--ink); margin: 0 0 16px; }

  .rsvp-btn {
    background: #fff;
    border: 1px solid var(--cream-line);
    color: var(--ink);
    font-size: 13px;
    padding: 10px 26px;
    border-radius: 20px;
    cursor: pointer;
  }

  .guest-circle {
    width: 90px;
    height: 90px;
    border-radius: 50%;

    display: flex;
    align-items: center;

  /* ---------- gallery / photo upload ---------- */
  .gallery { text-align: center; }

  .gallery-upload {
    display: inline-block;

  .qr-fake {

    height: 100px;
    margin: 0 auto 10px;

  .qr-fake .grid {
    width: 100%;
    height: 100%;
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    grid-template-rows: repeat(7, 1fr);
  }
  .qr-fake .grid span { background: var(--ink); }
  .qr-fake .grid span.off { background: transparent; }
  .qr-caption { font-size: 10px; color: var(--ink-soft); letter-spacing: 0.5px; }

  .gallery-thumbs {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;

  .gallery-thumbs img {

  /* ---------- footer ---------- */

  /* ---------- desktop / wide layout ----------

     full viewport, the hero becomes a photo+text row, and the paired
     sections below (location/location, dresscode/gift, rsvp/gallery)
     become two-column rows instead of stacking. */
  @media (min-width: 900px) {

<script>
  // ---------------------------------------------------------------------
  // Everything a couple/family would want to personalize lives here.
  // Edit these values, save, reload — nothing else in this file needs to change.
  // ---------------------------------------------------------------------
  const CONFIG = {
    name: 'Kyara',
    eventDate: '2026-12-19T18:00:00',      // ISO datetime used by the live countdown
    eventDateLabel: '19 Diciembre\n2026',   // shown as the big script date (line break optional)
    quote: 'Hay momentos en la vida que son especiales por sí solos, pero compartirlos con las personas que quieres los convierte en inolvidables.',
    song: { title: 'Nombre de la canción', artist: 'Artista' },

    venue: {
      name: 'Jardin Blanc',
      time: '7:00 PM',
      mapQuery: 'Antonio Caso 2060, Zona Urbana Rio Tijuana, 22010 Tijuana, B.C.'
    },
    itinerary: [
      { label: 'Inicio', time: '7:00 PM', icon: 'map' },
      { label: 'Cena',  time: '8:00 PM', icon: 'fork' },
      { label: 'Termina', time: '1:00 AM', icon: 'music' }
    ],

    dressCode: 'Formal',

    giftNote: 'Si deseas regalarme un detalle o un sobre será bien recibido, muchas gracias.',
    giftLabel: 'Mesa de regalos Amazon',
    giftUrl: '#',

    guestCount: 2,
    guestCountWord: 'dos'
  };

  const ICONS = {
    map: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M12 21s-7-6.4-7-11a7 7 0 1 1 14 0c0 4.6-7 11-7 11z"/><circle cx="12" cy="10" r="2.4"/></svg>`,
    fork: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M6 2v9M4 2v5a2 2 0 0 0 4 0V2M6 11v11M18 2c-2 0-3 3-3 6s1 3 3 3v11"/></svg>`,
    music: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M9 18V5l11-2v13M9 18a3 3 0 1 1-6 0 3 3 0 0 1 6 0zM20 16a3 3 0 1 1-6 0 3 3 0 0 1 6 0z"/></svg>`
  };
  function el(id) { return document.getElementById(id); }

  function render() {
    el('heroName').textContent = CONFIG.name;
    el('songLabel').textContent = `${CONFIG.song.title} — ${CONFIG.song.artist}`;
    el('quoteText').textContent = `“${CONFIG.quote}”`;
    el('eventDateLabel').innerHTML = CONFIG.eventDateLabel.replace('\n', '<br>');

    el('venueName').textContent = CONFIG.venue.name;
    el('venueTime').textContent = CONFIG.venue.time;
    el('venueMap').href = 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(CONFIG.venue.mapQuery);

    const timeline = el('timeline');
    timeline.innerHTML = CONFIG.itinerary.map((stop, i) => {
      const pos = i % 2 === 0 ? 'top' : 'bottom';
      const icon = ICONS[stop.icon];
      return `<div class="stop ${pos}">
        <span class="icon">${icon}</span>
        <span class="stop-label">${stop.label}<br><span class="stop-time">${stop.time}</span></span>
        <span class="dot"></span>
      </div>`;
    }).join('');

    el('dressCodeLabel').textContent = CONFIG.dressCode.toUpperCase();

    el('giftNote').textContent = CONFIG.giftNote;
    const giftLink = el('giftLink');
    giftLink.textContent = CONFIG.giftLabel.toUpperCase();
    giftLink.href = CONFIG.giftUrl;

    el('guestCount').textContent = CONFIG.guestCount;
    el('guestNote').textContent = `Hemos reservado ${CONFIG.guestCountWord} lugares para tí`;
  }

  // ---- live countdown ----
  function updateCountdown() {
    const target = new Date(CONFIG.eventDate).getTime();
    const now = Date.now();
    let diff = Math.max(0, target - now);

    const day = 24 * 60 * 60 * 1000;
    const hour = 60 * 60 * 1000;
    const minute = 60 * 1000;

    const days = Math.floor(diff / day);
    const hours = Math.floor((diff % day) / hour);
    const minutes = Math.floor((diff % hour) / minute);
    const seconds = Math.floor((diff % minute) / 1000);

    el('cdDays').textContent = String(days).padStart(3, '0');
    el('cdHours').textContent = String(hours).padStart(2, '0');
    el('cdMinutes').textContent = String(minutes).padStart(2, '0');
    el('cdSeconds').textContent = String(seconds).padStart(2, '0');
  }

  // ---- music player (visual only — no audio file wired up) ----
  let playing = false;
  el('playBtn').addEventListener('click', () => {
    playing = !playing;
    el('playIcon').innerHTML = playing
      ? '<path d="M7 5h4v14H7zM13 5h4v14h-4z"/>'
      : '<path d="M8 5v14l11-7z"/>';
  });

  // ---- RSVP ----
  el('rsvpBtn').addEventListener('click', () => {
    const btn = el('rsvpBtn');
    btn.textContent = '¡Asistencia confirmada!';
    btn.classList.add('confirmed');
    btn.disabled = true;
    el('rsvpMsg').textContent = `Gracias por confirmar — ¡${CONFIG.name} te espera!`;
  });

  // ---- fake QR grid (decorative placeholder, not a real scannable code) ----
  (function drawFakeQr() {
    const grid = el('qrGrid');
    let cells = '';
    // deterministic pseudo-random pattern, with solid corner "finder" blocks like a real QR
    const finder = (r, c) => (r < 2 && c < 2) || (r < 2 && c > 4) || (r > 4 && c < 2);
    for (let r = 0; r < 7; r++) {
      for (let c = 0; c < 7; c++) {
        const on = finder(r, c) || ((r * 13 + c * 7) % 5 < 2);
        cells += `<span class="${on ? '' : 'off'}"></span>`;
      }
    }
    grid.innerHTML = cells;
  })();

  // ---- local-only photo preview (nothing is uploaded anywhere) ----
  el('galleryInput').addEventListener('change', (e) => {
    const thumbs = el('galleryThumbs');
    Array.from(e.target.files).forEach(file => {
      const img = document.createElement('img');
      img.src = URL.createObjectURL(file);
      thumbs.appendChild(img);
    });
  });

  render();
  updateCountdown();
  setInterval(updateCountdown, 1000);
</script>
</body>
</html>
