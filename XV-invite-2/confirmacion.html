<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Confirmación · XV años Kyara</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#faf8f3;color:#53483e;font-family:Georgia,serif;text-align:center}main{width:min(480px,85vw);padding:50px 30px;border:1px solid #c5a36d;border-radius:110px 110px 15px 15px;background:#fffdf9}h1{font-weight:normal;font-size:34px}p{font-size:19px;line-height:1.6}a{color:#947b52}button{border:1px solid #9c815b;background:#9c815b;color:white;border-radius:30px;padding:12px 28px;font-size:15px;cursor:pointer}label{display:block;text-align:left;margin:18px auto 7px;font-size:15px}input,select{width:100%;box-sizing:border-box;padding:12px;border:1px solid #d5c3a7;border-radius:6px;background:white}small{display:block;line-height:1.4;margin-top:18px}</style></head><body><main><p>✧ ❄ ✧</p><h1>Confirma tu asistencia</h1><p>Mis XV Años · Kyara<br>19 de diciembre de 2026</p><form id="rsvp"><label for="nombre">Nombre completo</label><input id="nombre" required autocomplete="name"><label for="asistencia">¿Nos acompañarás?</label><select id="asistencia"><option value="Sí">Sí, asistiré</option><option value="No">No podré asistir</option></select><p><button type="submit">Preparar confirmación</button></p></form><small>Este formulario prepara un mensaje para compartir; la asistencia no se guarda automáticamente en un servidor.</small><p><a href="index.html">← Volver a la invitación</a></p></main><script>document.getElementById('rsvp').addEventListener('submit',e=>{e.preventDefault();const n=document.getElementById('nombre').value.trim(),a=document.getElementById('asistencia').value;const text='Confirmación XV años Kyara: '+n+' — '+a+'.';if(navigator.share){navigator.share({text}).catch(()=>{})}else if(navigator.clipboard){navigator.clipboard.writeText(text).then(()=>alert('Confirmación copiada. Compártela con el organizador.'))}else{prompt('Copia y comparte tu confirmación:',text)}})</script></body></html>
