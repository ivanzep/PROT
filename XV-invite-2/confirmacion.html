<!doctype html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Confirmación · XV Años de Kyara</title><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Montserrat:wght@400;500&display=swap" rel="stylesheet"><style>body{margin:0;background:#f9f6ef;color:#503e34;font-family:'Cormorant Garamond',Georgia,serif;min-height:100vh;display:grid;place-items:center}.wrap{width:min(90vw,540px);text-align:center;border:1px solid #bda07a;padding:45px 25px;background:#fffcf6;box-shadow:0 15px 45px #91795e22}h1{font-size:45px;font-weight:400;margin:0}p{font-size:23px}a{color:#946d44}label{font-size:20px;display:block;text-align:left;margin:20px 0 8px}input,select{width:100%;padding:14px;background:white;border:1px solid #beab95;border-radius:5px;font-size:16px}button{margin-top:24px;cursor:pointer;background:#9f7c56;color:#fff;border:0;border-radius:25px;padding:16px 30px;font-size:16px}small{display:block;margin-top:18px;font:12px/1.6 Montserrat,sans-serif;color:#71655c}.msg{padding-top:18px}</style></head><body><main class="wrap"><p>19 DICIEMBRE 2026 · JARDÍN BLANC</p><h1>Confirma tu asistencia</h1><p>Mis XV años · Kyara</p><form id="rsvp"><label for="name">Nombre completo</label><input required id="name" name="name" autocomplete="name"><label for="guests">¿Asistirás?</label><select id="guests" name="attendance"><option value="Sí">Sí, asistiré</option><option value="No">No podré asistir</option></select><label for="count">Número de personas</label><input id="count" type="number" value="1" min="1" max="20"><button type="submit">Preparar confirmación</button></form><div class="msg" id="result" aria-live="polite"></div><small>Esta página es una demostración de la confirmación. No envía información al organizador todavía: conecta aquí tu formulario o servicio de RSVP antes de publicar.</small><p><a href="index.html">← Volver a la invitación</a></p></main><script>document.getElementById('rsvp').addEventListener('submit',e=>{e.preventDefault();const name=document.getElementById('name').value.trim();const attendance=document.getElementById('guests').value;const count=document.getElementById('count').value;document.getElementById('result').textContent=`Confirmación preparada para ${name}: ${attendance}; personas: ${count}. Para enviarla, el organizador debe conectar un formulario de RSVP.`})</script></body></html>
